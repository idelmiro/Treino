name: Gerar APK

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar a página para dentro do app
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/index.html

      - name: Compilar APK assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: treino
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then export KEYSTORE_FILE="$GITHUB_WORKSPACE/android/treino-release.jks"; fi
          gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Publicar versão
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
          V: ${{ github.run_number }}
          HAS_KEY: ${{ secrets.KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::O APK compilou, mas falta o segredo KEYSTORE_PASSWORD para assinar e publicar (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "treino-v$V.apk"
          NOTES=$(printf '%s\n' "$NOTES" | grep -vE '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          gh release create "v$V" "treino-v$V.apk" \
            --title "Treino versão $V" \
            --notes "${NOTES:-Nova versão do app.}" \
            --latest
